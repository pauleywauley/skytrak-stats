<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyTrak Stats</title>
<style>
:root {
  color-scheme: dark;
  --page: #040709; --panel: #0a0f13; --panel-2: #121a20; --line: #25313a; --ring: rgba(255,255,255,.09);
  --ink: #e9ede6; --ink-2: #bcc4bd; --muted: #87928a; --lime: #a3bb6a;
  --turf-dark: #0c2612; --turf-light: #1a4a24;
  --good: #3f8a4f; --warn: #bf9a45; --crit: #a94a40;
  --fill-good: #24502e; --fill-close: #5f5527; --fill-off: #66352c;
}
/* Everything is sized in rem so the layout fills any monitor without scrolling. */
html { font-size: min(1vw, 1.778vh); }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  background: var(--page); color: var(--ink); user-select: none; -webkit-user-select: none;
  font: 500 1rem "Avenir Next Condensed", "DIN Alternate", "Helvetica Neue", system-ui, sans-serif;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { opacity: .35; cursor: default; }
[hidden] { display: none !important; }
.panel { background: var(--panel); border-radius: .42rem; }
.view { flex: 1; min-height: 0; padding: .31rem .62rem .5rem; gap: .62rem; display: flex; }

/* Top bar */
.bar { flex: none; height: 3.33rem; display: flex; align-items: center; gap: 1.4rem; padding: 0 1rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-size: 1.46rem; letter-spacing: .14em; white-space: nowrap; }
.brand em { font-style: normal; color: var(--lime); }
.tab { height: 2.3rem; font-size: 1.3rem; color: var(--ink-2); letter-spacing: .05em; text-transform: uppercase; }
.tab.on { color: var(--lime); font-weight: 600; }
.conn { flex: 1; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: .55rem; white-space: nowrap; }
.dot { width: 1.4rem; height: 1.4rem; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: #fff; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); color: #0a0f13; } .dot.crit { background: var(--crit); }
.conn b { font-size: 1.3rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.conn span { color: var(--ink-2); font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; }
.device { color: var(--ink-2); font-size: 1.25rem; letter-spacing: .03em; white-space: nowrap; }
.device b { color: var(--ink); font-weight: 600; margin-left: .3rem; }
.pill { height: 2.5rem; padding: 0 1.1rem; border-radius: 1.3rem; background: var(--lime); color: #0a0f13; font-size: 1.2rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
#menuBtn { width: 2.3rem; height: 2.3rem; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; }
.menu { position: fixed; z-index: 8; top: 3.6rem; right: .6rem; width: 19rem; padding: .4rem; border-radius: .5rem; background: var(--panel-2); box-shadow: 0 .8rem 2.4rem rgba(0,0,0,.6); }
.menu button { display: block; width: 100%; height: 2.9rem; padding: 0 .9rem; border-radius: .3rem; text-align: left; font-size: 1.3rem; letter-spacing: .03em; text-transform: uppercase; }
.menu button:hover { background: rgba(255,255,255,.08); }

/* Live screen: advice across the top, map and stat boxes below */
#live { position: relative; display: grid; gap: .5rem; grid-template-columns: 30rem minmax(0, 1fr) 22rem; grid-template-rows: 3.75rem 20.5rem minmax(0, 1fr) 5.9rem;
  grid-template-areas: "tools tools tools" "coach coach hero" "map tiles tiles" "map strip strip"; }
#live.no-details { grid-template-rows: 3.75rem 20.5rem minmax(0, 1fr); grid-template-areas: "tools tools tools" "coach coach hero" "map tiles tiles"; }
.map-panel { grid-area: map; position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; border-radius: .42rem; background: linear-gradient(0deg, var(--turf-dark), var(--turf-light)); }
.map-tools { position: absolute; z-index: 2; top: .73rem; left: .73rem; right: .73rem; display: flex; justify-content: space-between; align-items: center; }
.seg { display: flex; padding: .2rem; border-radius: 1.4rem; background: rgba(4,7,9,.72); }
.seg button { height: 2.3rem; padding: 0 1.15rem; border-radius: 1.15rem; font-size: 1.2rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.seg button.on { background: var(--lime); color: #0a0f13; }
#clear { height: 2.7rem; padding: 0 1.25rem; border-radius: 1.35rem; background: rgba(4,7,9,.72); font-size: 1.2rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.map { flex: 1; min-height: 0; position: relative; }
.map-stats { flex: none; height: 4.58rem; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; text-align: center; background: rgba(4,7,9,.76); }
.map-stats i { display: block; font-style: normal; color: var(--lime); font-weight: 600; font-size: 1.04rem; letter-spacing: .03em; text-transform: uppercase; }
.map-stats b { font-size: 1.88rem; font-weight: 500; line-height: 1.05; }
.none { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; color: var(--ink-2); font-size: 1.45rem; text-align: center; }
svg { display: block; }
svg text { fill: #fff; font-size: 1.1rem; font-family: inherit; }
#estNote, #scaleNote { position: absolute; z-index: 2; bottom: 5rem; color: var(--ink-2); font-size: 1.05rem; }
#estNote { left: .73rem; } #scaleNote { right: .73rem; }

.toolbar { grid-area: tools; display: flex; align-items: center; gap: .8rem; }
.club-btn { height: 3.44rem; padding: 0 1.4rem; border-radius: .42rem; background: var(--lime); color: #0a0f13; font-size: 1.98rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; display: flex; align-items: center; gap: .6rem; }
.club-btn small { font-size: 1.1rem; font-weight: 600; letter-spacing: .05em; }
.nav { width: 3.1rem; height: 3.1rem; border-radius: .42rem; background: var(--panel-2); font-size: 1.8rem; line-height: 1; }
#pos { font-size: 1.6rem; white-space: nowrap; }
#pos i { font-style: normal; color: var(--lime); font-weight: 600; margin-right: .3rem; }
#shotClub { font-size: 1.45rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; color: var(--ink-2); }
.link { color: var(--lime); font-size: 1.25rem; white-space: nowrap; }
.spacer { flex: 1; }
#detailsBtn { height: 2.9rem; padding: 0 1.4rem; border-radius: 1.45rem; background: var(--panel-2); font-size: 1.25rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

.label { color: var(--lime); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.est { color: var(--muted); font-size: .62em; font-weight: 500; letter-spacing: .05em; margin-left: .35em; }
.arr { display: inline-block; width: 0; height: 0; margin-right: .16em; vertical-align: .1em; border-top: .24em solid transparent; border-bottom: .24em solid transparent; }
.arr.l { border-right: .3em solid var(--ink); } .arr.r { border-left: .3em solid var(--ink); }

#hero { grid-area: hero; display: flex; min-width: 0; min-height: 0; }
.coach { grid-area: coach; padding: .6rem 1.1rem .5rem; display: flex; flex-direction: column; gap: .36rem; min-width: 0; min-height: 0; }
.coach-head { display: flex; align-items: center; gap: .9rem; }
#coachTitle { font-size: 3rem; font-weight: 600; letter-spacing: .02em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
.badge { padding: .22rem .7rem; border-radius: .3rem; font-size: 1.15rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--ink); }
.badge.good { background: var(--fill-good); } .badge.close { background: var(--fill-close); } .badge.off { background: var(--fill-off); }
.coach-legend { margin-left: auto; color: var(--muted); font-size: 1.05rem; white-space: nowrap; }
.coach-line { display: grid; grid-template-columns: 8.4rem minmax(0, 1fr); align-items: baseline; }
.coach-line i { font-style: normal; color: var(--lime); font-size: 1.12rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.coach-line span { font-size: 1.6rem; line-height: 1.17; }
.coach-line.work { grid-template-columns: 1fr; }
.coach-line.work i { font-size: 1.3rem; }
.coach-line.work span { font-size: 3.2rem; font-weight: 600; line-height: 1.1; }
.impact { grid-area: tiles; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: .42rem; }
.big { display: flex; flex-direction: column; align-items: center; padding: .55rem .9rem .5rem; min-width: 0; min-height: 0; }
.big .label { font-size: 1.55rem; }
.big-value { flex: 1; display: flex; align-items: center; font-size: 4.5rem; line-height: 1; font-weight: 500; white-space: nowrap; }
.big-value.long { font-size: 3.7rem; }
.big.good { background: var(--fill-good); } .big.close { background: var(--fill-close); } .big.off { background: var(--fill-off); }
.big.good .label, .big.good .cue, .big.good .est, .big.good .foot-unit, .big.good .foot-stat i,
.big.close .label, .big.close .cue, .big.close .est, .big.close .foot-unit, .big.close .foot-stat i,
.big.off .label, .big.off .cue, .big.off .est, .big.off .foot-unit, .big.off .foot-stat i { color: var(--ink); }
.big.good .cue, .big.off .cue, .big.close .cue { font-weight: 600; }
.hero { flex: 1; }
.hero .label { font-size: 1.9rem; }
.hero .big-value { font-size: 10.6rem; }
.cue { color: var(--ink-2); font-size: 1.22rem; min-height: 1.55rem; white-space: nowrap; }
.big.cause { box-shadow: inset 0 0 0 .2rem rgba(233,237,230,.72); }
.foot { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
.foot-stat { font-size: 1.35rem; line-height: 1.06; font-weight: 600; white-space: nowrap; }
.foot-stat i { display: block; font-style: normal; color: var(--lime); font-size: .95rem; font-weight: 600; }
.foot-stat.end { text-align: right; }
.foot-unit { color: var(--ink-2); font-size: 1.15rem; letter-spacing: .1em; text-transform: uppercase; }.fresh .big-value, .fresh .mini-value { animation: fresh .9s ease-out; }
@keyframes fresh { from { color: var(--lime); } }

.details { grid-area: strip; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .31rem; }
.mini { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .3rem; min-width: 0; min-height: 0; border-radius: .31rem; }
.mini .label { font-size: 1.08rem; }
.mini-value { font-size: 2.3rem; font-weight: 500; line-height: 1.04; white-space: nowrap; }
.mini-avg { color: var(--ink-2); font-size: 1rem; white-space: nowrap; }

.pop { position: absolute; z-index: 5; left: .62rem; top: 4.3rem; width: 33.33rem; padding: .73rem; border-radius: .52rem; background: var(--panel-2); box-shadow: 0 .8rem 2.4rem rgba(0,0,0,.6); }
#clubPopTitle { color: var(--lime); font-weight: 600; font-size: 1.25rem; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 .5rem .1rem; }
#chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .31rem; }
.chip { height: 3.1rem; border-radius: .31rem; font-size: 1.4rem; font-weight: 600; background: var(--panel); color: var(--ink); }
.chip.on { background: var(--lime); color: #0a0f13; }

/* History */
#sessions { width: 22rem; flex: none; overflow-y: auto; padding: .45rem; }
.session { display: block; width: 100%; text-align: left; padding: .55rem .75rem; border-radius: .3rem; margin-bottom: .15rem; }
.session.on { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--lime); }
.session b { display: block; font-size: 1.3rem; font-weight: 600; }
.session span { color: var(--ink-2); font-size: 1.08rem; }
.hist { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .5rem; }
.filter { flex: none; display: flex; flex-wrap: wrap; gap: .25rem; }
.filter .chip { height: 2.5rem; padding: 0 1rem; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .03em; background: var(--panel-2); color: var(--ink-2); }
.filter .chip.on { background: var(--lime); color: #0a0f13; }
.hist-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: .4rem .9rem; }
h3 { color: var(--lime); font-size: 1.3rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin: .5rem 0 .35rem; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-bottom: 1rem; }
th { position: sticky; top: -.4rem; background: var(--panel); color: var(--ink-2); font-weight: 500; font-size: 1.05rem; letter-spacing: .02em; text-transform: uppercase; text-align: right; padding: .3rem .45rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: .34rem .45rem; border-bottom: 1px solid #182128; font-size: 1.22rem; white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
#shotTable th:nth-child(3), #shotTable td:nth-child(3) { text-align: left; }
#shotTable tbody tr { cursor: pointer; }
#shotTable tbody tr:hover { background: var(--panel-2); }
.table-note { color: var(--muted); font-size: 1.05rem; margin-bottom: .5rem; }

.toast { position: fixed; top: 4.2rem; left: 50%; transform: translateX(-50%); padding: .6rem 1.3rem; border-radius: .4rem; background: var(--panel-2); font-size: 1.4rem; box-shadow: 0 0 0 1px var(--warn); }
.tip { position: fixed; z-index: 9; pointer-events: none; padding: .45rem .7rem; border-radius: .3rem; background: rgba(4,7,9,.94); box-shadow: 0 0 0 1px var(--ring); font-size: 1.15rem; line-height: 1.3; white-space: nowrap; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">SKYTRAK <em>STATS</em></div>
  <button class="tab" data-view="live">Live</button>
  <button class="tab" data-view="history">History</button>
  <div class="conn" id="conn"></div>
  <div class="device" id="device"></div>
  <button class="pill" id="updateNow" hidden></button>
  <button id="menuBtn" aria-label="Menu"><svg width="22" height="6" viewBox="0 0 22 6" aria-hidden="true"><circle cx="3" cy="3" r="2.5" fill="#fff"/><circle cx="11" cy="3" r="2.5" fill="#fff"/><circle cx="19" cy="3" r="2.5" fill="#fff"/></svg></button>
</header>
<div class="menu" id="menu" hidden>
  <button id="update">Checking for updates</button>
  <button id="display">Move Screen</button>
  <button id="fill">Full Screen</button>
  <button id="hand">Golfer: Right-Handed</button>
  <button id="quit">Quit</button>
</div>

<main class="view" id="live">
  <section class="map-panel">
    <div class="map-tools">
      <div class="seg">
        <button data-mode="shape">Shot Shape</button>
        <button data-mode="dispersion">Dispersion</button>
      </div>
      <button id="clear">Clear</button>
    </div>
    <div class="map" id="map"></div>
    <div id="estNote"></div>
    <div id="scaleNote"></div>
    <div class="map-stats" id="mapStats"></div>
  </section>
  <div class="toolbar">
    <button class="club-btn" id="clubBtn"></button>
    <button class="nav" id="prev" aria-label="Previous shot">‹</button>
    <div id="pos"></div>
    <button class="nav" id="next" aria-label="Next shot">›</button>
    <div id="shotClub"></div>
    <button class="link" id="edit">Change</button>
    <button class="link" id="latest">Latest</button>
    <div class="spacer"></div>
    <button id="detailsBtn"></button>
  </div>
  <div class="panel coach">
    <div class="coach-head">
      <div id="coachTitle"></div>
      <div class="badge" id="coachBadge"></div>
      <div class="coach-legend" id="coachLegend">Outlined boxes show the cause</div>
    </div>
    <div class="coach-line work"><i>Work on</i><span id="coachWork"></span></div>
    <div class="coach-line"><i>What happened</i><span id="coachWhat"></span></div>
    <div class="coach-line"><i>Why</i><span id="coachWhy"></span></div>
  </div>
  <div id="hero"></div>
  <div class="impact" id="impact"></div>
  <div class="details" id="details"></div>
  <div class="pop" id="clubPop" hidden>
    <div id="clubPopTitle"></div>
    <div id="chips"></div>
  </div>
</main>

<main class="view" id="history" hidden>
  <aside class="panel" id="sessions"></aside>
  <section class="hist">
    <div class="filter" id="histClubs"></div>
    <div class="panel hist-scroll">
      <h3>By Club</h3>
      <table id="byClub"></table>
      <h3>Shots</h3>
      <table id="shotTable"></table>
      <div class="table-note">~ means calculated live. SkyTrak's own number replaces it after its next cloud sync.</div>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = id => document.getElementById(id);
const native = m => { try { window.webkit.messageHandlers.app.postMessage(m); } catch (e) {} };
const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);

const CLUBS = ['DR','3W','5W','7W','3H','4H','5H','4I','5I','6I','7I','8I','9I','PW','50/W','52/W','54/W','56/W','58/W','60/W','PT'];
const S = { shots: [], status: null, update: null, nextClub: null, view: 'live', cursor: null, clubMenu: null, menuOpen: false,
            fresh: false, histSession: null, histClub: null, mapMode: 'shape', mapClearedAt: 0, fill: false, details: true, ranges: {}, lefty: false };

// est: 1 = calculated until SkyTrak's sync, 2 = always SkyTrak's rough estimate, 'path' = follows pathEstimated.
// band: where this stat's target columns start in SkyTrak's table.
// sym: good and close limits for a stat that wants to be near zero; club comes from rangeClub.
const FACE_TO_PATH = { DR: [1.5, 2.5], FW: [2, 3.5], '2H': [2, 3.5], PW: [3.5, 6], SW: [3.5, 6] };
const HERO = { l: 'Smash Factor', g: s => s.smash, d: 2, cue: () => 'Ball speed ÷ club speed' };
const TILES = [
  { l: 'Launch Angle', u: 'Deg', g: s => s.launch, d: 1, band: 0 },
  { l: 'Back Spin', u: 'RPM', g: s => s.backSpin, d: 0, band: 4 },
  { l: 'Descent Angle', u: 'Deg', g: s => s.descent, d: 0, est: 1, band: 8 },
  { l: 'Ball Speed', u: 'MPH', g: s => s.ballSpeed, d: 0 },
  { l: 'Club Speed', u: 'MPH', g: s => s.clubSpeed, d: 0 },
  { l: 'Club Path', u: 'Deg', g: s => s.clubPath, d: 1, lr: 1, est: 'path', sym: () => [4, 6] },
  { l: 'Face to Path', u: 'Deg', g: s => s.faceToPath, d: 1, lr: 1, est: 'path', sym: club => FACE_TO_PATH[club] || [2.5, 5] },
  { l: 'Face to Target', u: 'Deg', g: s => s.faceToTarget, d: 1, lr: 1, est: 'path', sym: () => [2, 5] },
  { l: 'Spin Axis', u: 'Deg', g: s => s.spinAxis, d: 1, lr: 1, sym: () => [6, 15] },
  { l: 'Side Spin', u: 'RPM', g: s => s.sideSpin, d: 0, lr: 1, byAxis: 1 },
];
const DETAILS = [
  { l: 'Side Angle', g: s => s.hla, d: 1, lr: 1 },
  { l: 'Total Spin', g: s => s.totalSpin, d: 0 },
  { l: 'Offline', g: s => s.offline, d: 0, lr: 1, est: 1 },
  { l: 'Max Height', g: s => s.apex, d: 1, est: 1 },
  { l: 'Flight Time', g: s => s.flightTime, d: 1, est: 1 },
  { l: 'Angle of Attack', g: s => s.attackAngle, d: 1, signed: 1, est: 2 },
];

// SkyTrak's table groups clubs: all woods, all hybrids, and wedges by loft.
function rangeClub(c) {
  if (/^\d+W$/.test(c)) return 'FW';
  if (/^\d+H$/.test(c)) return '2H';
  if (/^[123]I$/.test(c)) return '4I';
  if (c === 'GW') return 'PW';
  if (c === 'LW') return 'SW';
  const wedge = c.match(/^(\d+)\/W$/);
  return wedge ? (Number(wedge[1]) <= 52 ? 'PW' : 'SW') : c;
}

// TrackMan 2023 LPGA Tour averages. SkyTrak's table has no smash targets, and TrackMan stops at PW.
const SMASH_AVERAGE = { DR: 1.49, FW: 1.46, '2H': 1.44, '4I': 1.43, '5I': 1.42, '6I': 1.41, '7I': 1.38, '8I': 1.36, '9I': 1.30, PW: 1.25 };
const grade = (level, goal, low, high) => ({ level, low, high, text: `${{ good: 'Good', close: 'Close', off: 'Off' }[level]} · Goal ${goal}` });

function rating(t, s) {
  if (!s || !known(t.g(s))) return null;
  const club = s.club ? rangeClub(s.club) : null, v = t.g(s);
  if (t.sym) {
    const [good, close] = t.sym(club), size = Math.abs(v);
    return grade(size <= good ? 'good' : size <= close ? 'close' : 'off', `±${good}°`);
  }
  if (t.byAxis) {
    const tilt = Math.abs(s.spinAxis), limit = Math.round(s.totalSpin * Math.sin(6 * Math.PI / 180) / 10) * 10;
    return grade(tilt <= 6 ? 'good' : tilt <= 15 ? 'close' : 'off', `±${limit}`);
  }
  if (!club || !known(s.clubSpeed)) return null;
  if (t === HERO) {
    const average = SMASH_AVERAGE[club];
    if (!average) return null;
    return grade(v >= average - 0.05 ? 'good' : v >= average - 0.10 ? 'close' : 'off', `${(average - 0.05).toFixed(2)}+`);
  }
  const table = t.band != null && S.ranges[club];
  if (!table) return null;
  const speeds = Object.keys(table).map(Number);
  const row = table[Math.max(Math.min(...speeds), Math.min(Math.max(...speeds), Math.round(s.clubSpeed)))];
  if (!row) return null;
  const [closeLow, closeHigh, low, high] = row.slice(t.band, t.band + 4);
  return grade(v >= low && v <= high ? 'good' : v >= closeLow && v <= closeHigh ? 'close' : 'off', `${low}–${high}`, low, high);
}

// A strike well under her own recent normal, or far under the tour number before there's a baseline.
function strikeOff(s, pool) {
  if (!known(s.smash) || !s.club) return false;
  const own = values(pool.filter(x => x !== s), x => x.smash);
  if (own.length >= 8) return s.smash < mean(own) * 0.92;
  const average = SMASH_AVERAGE[rangeClub(s.club)];
  return !!average && s.smash < average - 0.15;
}

// The single biggest thing to work on, stated at the level of face and path because that's all the
// launch monitor can speak to. Uses the same face and path numbers shown in the boxes.
// A perfect shot started and curved the way it should, so its advice skips direction.
function workOn(s, pool, mishit, flip, off, bend, landed, perfect) {
  const own = values(pool.filter(x => x !== s), x => x.smash);
  const normal = own.length >= 8 ? `your usual ${num(mean(own), 2)}` : `a goal of ${num((SMASH_AVERAGE[rangeClub(s.club || '')] || 0) - 0.05, 2)}`;
  if (mishit) return `Contact first: ${num(s.smash, 2)} smash against ${normal}. Work on hitting the center of the face.`;
  if (!known(s.faceToTarget) || !known(s.clubPath)) return '';
  const face = s.faceToTarget * flip, path = s.clubPath * flip, wide = !perfect && Math.abs(face) > 2, far = !perfect && Math.abs(path) > 4;
  const faceSay = `Face was about ${num(Math.abs(face))}° ${face > 0 ? `open. Try closing it${Math.abs(face) < 5 ? ' a little' : ''} at impact.` : 'closed. Try keeping it more open at impact.'}`;
  const pathName = path > 0 ? 'in-to-out' : 'out-to-in';
  if (wide && far && face * path > 0 && bend < 6) {
    return `Face and path both pointed about ${num(Math.abs(s.faceToTarget + s.clubPath) / 2)}° ${s.faceToTarget > 0 ? 'right' : 'left'} of the target. Check your aim, then start it closer.`;
  }
  if (wide && (!far || Math.abs(face) / 2 >= Math.abs(path) / 4)) return `${faceSay} ${far ? 'Fix this first.' : 'Path looked good.'}`;
  if (far) return `Path was about ${num(Math.abs(path))}° ${pathName}. Try a less ${pathName} swing. ${wide ? 'Fix this first.' : 'Face looked good.'}`;
  if (!perfect && bend >= 6) return `Face and path were about ${num(Math.abs(face - path))}° apart, which made it curve. Try bringing them closer together.`;
  if (!perfect && off >= 2) return `It started ${num(off, 1)}° ${s.hla > 0 ? 'right' : 'left'} of the target. Try pointing the face a little closer to it.`;
  if (known(s.offline) && !landed && bend >= 2) return `Good shape. To finish on target, start it a little more to the ${s.spinAxis > 0 ? 'left' : 'right'}.`;
  const smash = rating(HERO, s);
  if (smash && smash.level === 'off') return `Direction was good. Smash was ${num(s.smash, 2)}, under the goal. Work on hitting the center of the face.`;
  const launch = rating(TILES[0], s);
  if (launch && launch.level === 'off') {
    const low = s.launch < launch.low;
    return `Direction was good. Launch was ${num(s.launch, 1)}°, ${low ? 'below' : 'above'} the ${launch.low}–${launch.high} goal. Try ${low ? 'adding' : 'taking off'} a little loft at impact.`;
  }
  return 'Everything looked good. Repeat that.';
}

// Reads a shot from the two measured numbers: side angle is where it started, spin axis is how it
// curved. Under 2 degrees of axis is straight (TrackMan), 6 is SkyTrak's limit for an iron, and
// 15 is where SkyTrak's article starts treating curve as a problem; nobody authoritative publishes
// a hook or slice line. Perfect windows follow the published draw and fade recipes. Start and axis are mirrored for a left-hander; directions shown to her are not.
function coach(s, pool) {
  if (!known(s.hla) || !known(s.spinAxis) || !s.totalSpin) return null;
  const flip = S.lefty ? -1 : 1, start = s.hla * flip, axis = s.spinAxis * flip;
  const off = Math.abs(start), bend = Math.abs(axis);
  const dir = v => (v > 0 ? 'right' : 'left');
  const yards = v => `${num(Math.abs(v))} yd${Math.round(Math.abs(v)) === 1 ? '' : 's'}`;
  const landed = known(s.offline) && Math.abs(s.offline) <= (['DR', 'FW', '2H'].includes(rangeClub(s.club || '')) ? 10 : 5);
  const mishit = strikeOff(s, pool);

  const draw = start >= 1 && start <= 3 && axis <= -2 && axis >= -6;
  const fade = start <= -1 && start >= -3 && axis >= 2 && axis <= 6;
  const average = SMASH_AVERAGE[rangeClub(s.club || '')];
  const solid = !average || !known(s.smash) || s.smash >= average - 0.15;
  const perfect = (draw || fade) && landed && !mishit && solid;
  const crossing = off >= 2 && bend >= 2 && start * axis < 0;

  const curve = bend < 2 ? '' : axis < 0 ? (bend >= 15 ? 'Hook' : 'Draw') : (bend >= 15 ? 'Slice' : 'Fade');
  const opening = off < 2 ? '' : start > 0 ? (off > 5 && axis > -2 ? 'Block' : 'Push') : (off > 5 && bend < 2 ? 'Big Pull' : 'Pull');
  const big = !opening && bend >= 6 && bend < 15 ? 'Big ' : '';
  const title = perfect ? `Perfect ${draw ? 'Draw' : 'Fade'}` : [opening, big + curve].join(' ').trim() || 'Straight';

  const good = perfect || (off < 2 && bend <= 6) || (crossing && landed && bend <= 6 && off <= 5);
  const level = good && !mishit ? 'good' : off > 5 || bend >= 15 ? 'off' : 'close';

  const carried = known(s.carry) ? bend * 0.007 * s.carry : 0;
  const what = `Started ${off < 2 && !perfect ? 'on line' : `${num(off, 1)}° ${dir(s.hla)}`}, `
    + `${bend < 2 ? 'flew straight' : `curved ${carried >= 1 ? `about ${yards(carried)} ` : ''}${dir(s.spinAxis)}`}`
    + `${known(s.offline) ? `, and finished ${Math.abs(s.offline) < 1 ? 'on your line' : `${yards(s.offline)} ${dir(s.offline)}`}` : ''}.`;

  const aim = start >= 2 ? 'open' : start <= -2 ? 'closed' : 'square';
  const gap = `${bend >= 15 ? 'very ' : ''}${axis < 0 ? 'closed' : 'open'} to your path`;
  let why;
  if (perfect) {
    why = `Face pointed a little ${dir(s.hla)} of the target and was ${gap}. That is exactly how a ${draw ? 'draw' : 'fade'} is built.`;
  } else if (bend < 2) {
    why = off < 2 ? 'Face and path matched, and both pointed at the target.'
      : `Face and path matched, but both pointed ${off > 5 ? 'well ' : ''}${dir(s.hla)} of the target.`;
  } else if (off < 2) {
    why = `Face was about square to the target but ${gap}. Your path went ${axis < 0 ? 'in-to-out' : 'out-to-in'}.`;
  } else if (crossing) {
    why = bend > 6 ? `Face was ${aim} to the target but ${gap}, so it curved more than it needed to.`
      : `Face was ${aim} to the target but ${gap}, the right recipe for a ${axis < 0 ? 'draw' : 'fade'}.`;
    if (bend <= 6 && !landed && s.offline * s.hla > 0) why += ` It started too far ${dir(s.hla)} to come all the way back.`;
  } else {
    why = `Face was ${aim} to the target and ${gap} too. The face did most of this.`;
  }
  if (mishit) why += ' Off-center contact may have added to this.';

  const tiles = bend < 2 ? (off < 2 ? ['Face to Target', 'Face to Path'] : ['Face to Target', 'Club Path'])
    : off < 2 && !perfect ? ['Face to Path', 'Club Path']
    : crossing || perfect ? ['Face to Target', 'Face to Path', 'Club Path'] : ['Face to Target', 'Face to Path'];
  return { title, level, badge: perfect ? 'Textbook' : { good: 'Good', close: 'Playable', off: 'Miss' }[level], what, why, work: workOn(s, pool, mishit, flip, off, bend, landed, perfect), tiles };
}

function renderCoach(read, s) {
  $('coachTitle').textContent = read ? read.title : s ? 'No read on this shot' : 'Hit a shot';
  $('coachBadge').hidden = !read;
  $('coachLegend').hidden = !read;
  if (read) { $('coachBadge').textContent = read.badge; $('coachBadge').className = `badge ${read.level}`; }
  $('coachWhat').textContent = read ? read.what : '';
  $('coachWhy').textContent = read ? read.why : '';
  $('coachWork').textContent = read ? read.work : '';
}

const known = v => v != null && isFinite(v);
const num = (v, d = 0) => known(v) ? v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false }) : '—';
const isZero = (v, d) => Math.abs(v) < 0.5 * Math.pow(10, -d);
const signed = (v, d) => (isZero(v, d) ? '' : v > 0 ? '+' : '−') + num(Math.abs(v), d);
const sideText = (v, d = 0) => !known(v) ? '—' : isZero(v, d) ? num(0, d) : `${num(Math.abs(v), d)} ${v > 0 ? 'R' : 'L'}`;

function valueHTML(t, v) {
  if (!known(v)) return '—';
  const body = num(Math.abs(v), t.d);
  if (t.lr) return isZero(v, t.d) ? body : `<span class="arr ${v > 0 ? 'r' : 'l'}"></span>${body}`;
  if (t.signed) return signed(v, t.d);
  return (v < 0 ? '−' : '') + body;
}

function isEstimate(t, s) {
  if (!known(t.g(s))) return false;
  if (t.est === 2) return true;
  if (t.est === 'path') return !!s.pathEstimated;
  return t.est === 1 && !s.official;
}
const estTag = (t, s) => s && isEstimate(t, s) ? '<span class="est">EST</span>' : '';

function clubName(c) {
  if (!c) return 'No Club Set';
  const names = { DR: 'Driver', PT: 'Putter', PW: 'Pitching Wedge', GW: 'Gap Wedge', SW: 'Sand Wedge', LW: 'Lob Wedge' };
  if (names[c]) return names[c];
  let m;
  if ((m = c.match(/^(\d+)W$/))) return m[1] + ' Wood';
  if ((m = c.match(/^(\d+)H$/))) return m[1] + ' Hybrid';
  if ((m = c.match(/^(\d+)I$/))) return m[1] + ' Iron';
  if ((m = c.match(/^(\d+)\/W$/))) return m[1] + '° Wedge';
  return c;
}
const clubShort = c => { const m = c && c.match(/^(\d+)\/W$/); return m ? m[1] + '°' : (c || '—'); };
const clubRank = c => { const i = CLUBS.indexOf(c); return i < 0 ? 99 : i; };

const clock = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' });
const day = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
const longDay = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
function when(t) {
  const d = new Date(t * 1000);
  return (d.toDateString() === new Date().toDateString() ? 'Today' : day.format(d)) + ', ' + clock.format(d);
}

function sessions() {
  const out = [];
  for (const s of S.shots) {
    const last = out[out.length - 1];
    if (last && s.time - last.end < 3600) { last.shots.push(s); last.end = s.time; }
    else out.push({ start: s.time, end: s.time, shots: [s] });
  }
  return out;
}
const sessionOf = s => sessions().find(x => x.shots.includes(s));
const cursorIndex = () => {
  if (S.cursor == null) return S.shots.length - 1;
  const i = S.shots.findIndex(s => s.id === S.cursor);
  return i < 0 ? S.shots.length - 1 : i;
};

function mean(v) { return v.reduce((a, b) => a + b, 0) / v.length; }
function deviation(v) { const m = mean(v); return Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / v.length); }
function values(pool, get) { return pool.map(get).filter(known); }
const avgText = (t, v) => (t.lr || t.signed) ? signed(mean(v), t.d) : num(mean(v), t.d);

function renderTiles(s, pool) {
  const read = s && coach(s, pool);
  renderCoach(read, s);
  const tile = t => {
    const v = s ? values(pool, t.g) : [], stats = v.length > 1, value = s ? t.g(s) : null;
    const long = known(value) && num(Math.abs(value), t.d).length + (t.lr || t.signed ? 1 : 0) > 4;
    const rated = rating(t, s);
    const cue = known(value) && t.cue ? t.cue(value) : '';
    const cause = read && known(value) && read.tiles.includes(t.l);
    return `<div class="panel big${t === HERO ? ' hero' : ''}${rated ? ' ' + rated.level : ''}${cause ? ' cause' : ''}">
      <div class="label">${t.l}${estTag(t, s)}</div>
      <div class="big-value${long ? ' long' : ''}">${s ? valueHTML(t, value) : '—'}</div>
      <div class="cue">${rated ? rated.text : cue || t.u || ''}</div>
      ${t !== HERO ? '' : `<div class="foot">
        <div class="foot-stat">${stats ? `<i>AVG</i>${avgText(t, v)}` : ''}</div>
        <div class="foot-unit"></div>
        <div class="foot-stat end">${stats ? `<i>+/-</i>${num(deviation(v), t.d)}` : ''}</div>
      </div>`}
    </div>`;
  };
  $('hero').innerHTML = tile(HERO);
  $('impact').innerHTML = TILES.map(tile).join('');
  $('details').innerHTML = DETAILS.map(t => {
    const v = s ? values(pool, t.g) : [];
    return `<div class="panel mini">
      <div class="label">${t.l}${estTag(t, s)}</div>
      <div class="mini-value">${s ? valueHTML(t, t.g(s)) : '—'}</div>
      <div class="mini-avg">${v.length > 1 ? `avg ${avgText(t, v)}` : '&nbsp;'}</div>
    </div>`;
  }).join('');
}

function renderClubMenu(s) {
  $('clubPop').hidden = !S.clubMenu;
  if (!S.clubMenu) return;
  const active = S.clubMenu === 'shot' && s ? s.club : S.nextClub;
  $('clubPopTitle').textContent = S.clubMenu === 'shot' ? "This shot's club" : 'Club for your next shot';
  $('chips').innerHTML = CLUBS.map(c => `<button class="chip${c === active ? ' on' : ''}" data-club="${c}">${clubShort(c)}</button>`).join('');
}

function renderLive() {
  const i = cursorIndex(), s = i >= 0 ? S.shots[i] : null;
  const session = s ? sessionOf(s) : null;
  const pool = s ? session.shots.filter(x => !s.club || x.club === s.club) : [];

  $('clubBtn').innerHTML = S.nextClub ? `<small>NEXT SHOT</small>${clubName(S.nextClub)}` : 'Select Club';
  $('prev').disabled = i <= 0;
  $('next').disabled = i < 0 || i >= S.shots.length - 1;
  $('pos').innerHTML = s ? `<i>SHOT</i>${session.shots.indexOf(s) + 1} of ${session.shots.length}` : 'Hit a shot';
  $('shotClub').textContent = s ? clubName(s.club) : '';
  $('edit').hidden = !s;
  $('latest').hidden = S.cursor == null;
  $('detailsBtn').textContent = S.details ? 'Hide Details' : 'Show All Stats';
  $('details').hidden = !S.details;
  $('live').classList.toggle('no-details', !S.details);
  $('estNote').textContent = !s || (s.official && !s.pathEstimated) ? ''
    : s.onCourse && !s.official ? 'EST = flat ground. SkyTrak adjusts for terrain.' : "EST = calculated until SkyTrak's next sync";

  renderTiles(s, pool);
  renderClubMenu(s);
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mapMode));
  drawMap(s, session);
  $('live').classList.toggle('fresh', S.fresh);
  if (S.fresh) setTimeout(() => $('live').classList.remove('fresh'), 1000);
  S.fresh = false;
}

// Map

function showTip(x, y, html) {
  const t = $('tip');
  t.innerHTML = html; t.hidden = false;
  t.style.left = Math.min(x + 14, innerWidth - t.offsetWidth - 8) + 'px';
  t.style.top = Math.max(y - t.offsetHeight - 10, 4) + 'px';
}
const hideTip = () => { $('tip').hidden = true; };

// A cleared map only shows newer shots; browsing back past the clear shows that session.
function mapPool(s, session) {
  if (!s) return [];
  const since = S.cursor != null && s.time <= S.mapClearedAt ? 0 : S.mapClearedAt;
  return session.shots.filter(x => x.time > since && x.time <= s.time && known(x.carry) && known(x.offline)).slice(-40);
}

function drawMap(s, session) {
  const el = $('map'), W = el.clientWidth, H = el.clientHeight, r = rem();
  if (!W || !H) return;
  el.onmousemove = el.onclick = el.onmouseleave = null;
  const pool = mapPool(s, session);
  renderMapStats(pool);
  $('scaleNote').textContent = '';

  const far = Math.max(40, ...pool.map(x => x.carry));
  const step = far > 180 ? 50 : far > 70 ? 25 : 10;
  const top = Math.ceil(far * 1.12 / step) * step;
  const margin = { t: 4 * r, b: 1.8 * r };
  const perYard = (H - margin.t - margin.b) / top;
  const room = (W / 2 - 3 * r) / perYard;
  const widest = Math.max(1, ...pool.map(x => Math.abs(x.offline)));
  // Side-to-side is stretched only when shots would otherwise bunch up or run off the edge.
  const stretch = Math.max(0.25, Math.min(3, Math.floor(room / widest * 0.85 * 4) / 4));
  const X = side => W / 2 + side * stretch * perYard, Y = dist => H - margin.b - dist * perYard;
  if (pool.length && stretch !== 1) $('scaleNote').textContent = `Side to side ×${stretch}`;

  let g = '', lastLabel = Infinity;
  for (let d = step; d <= top; d += step) {
    let path = '';
    for (let i = 0; i <= 48; i++) {
      const a = -1.15 + 2.3 * i / 48;
      path += (i ? 'L' : 'M') + X(d * Math.sin(a)).toFixed(1) + ' ' + Y(d * Math.cos(a)).toFixed(1);
    }
    g += `<path d="${path}" fill="none" stroke="rgba(255,255,255,.32)"/>`;
    const edge = (W / 2 - 2.8 * r) / (stretch * perYard);
    const labelY = Y(edge < d ? Math.sqrt(d * d - edge * edge) : d);
    if (labelY > margin.t && lastLabel - labelY > 1.3 * r) {
      g += `<text x="${W - .6 * r}" y="${labelY + .35 * r}" text-anchor="end">${d}</text>`;
      lastLabel = labelY;
    }
  }
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${margin.t}" y2="${Y(0)}" stroke="rgba(255,255,255,.4)"/>`;
  g += `<circle cx="${X(0)}" cy="${Y(0)}" r="${.28 * r}" fill="#fff"/>`;

  const earlier = pool.filter(x => x !== s), me = pool.find(x => x === s);
  const landing = x => ({ x: X(x.offline), y: Y(x.carry), s: x });

  if (S.mapMode === 'shape') {
    const line = (x, stroke, width) => {
      const start = Math.tan((x.hla || 0) * Math.PI / 180), bend = x.offline - x.carry * start;
      let path = '';
      for (let i = 0; i <= 32; i++) {
        const d = x.carry * i / 32, side = d * start + bend * (i / 32) ** 2;
        path += (i ? 'L' : 'M') + X(side).toFixed(1) + ' ' + Y(d).toFixed(1);
      }
      return `<path d="${path}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"/>`;
    };
    g += earlier.map(x => line(x, 'rgba(166,206,57,.62)', 2)).join('');
    g += earlier.map(x => { const p = landing(x); return `<circle cx="${p.x}" cy="${p.y}" r="${.3 * r}" fill="#a6ce39"/>`; }).join('');
    if (me) g += line(me, '#ffffff', 3.5);
  } else {
    const group = s && s.club ? pool.filter(x => x.club === s.club) : pool;
    if (group.length > 2) {
      const sides = group.map(x => x.offline), carries = group.map(x => x.carry);
      const rx = Math.max(1.5 * deviation(sides) * stretch * perYard, .4 * r), ry = Math.max(1.5 * deviation(carries) * perYard, .4 * r);
      g += `<ellipse cx="${X(mean(sides))}" cy="${Y(mean(carries))}" rx="${rx}" ry="${ry}" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/>`;
    }
    g += earlier.map(x => { const p = landing(x); return `<circle cx="${p.x}" cy="${p.y}" r="${.42 * r}" fill="#a6ce39" stroke="#0c2612" stroke-width="2"/>`; }).join('');
  }
  if (me) { const p = landing(me); g += `<circle cx="${p.x}" cy="${p.y}" r="${.62 * r}" fill="#fff" stroke="#0c2612" stroke-width="2"/>`; }

  const empty = pool.length ? '' : `<div class="none">${s && s.time <= S.mapClearedAt ? 'Map cleared. Your next shot starts a new one.' : 'Hit a shot to start the map'}</div>`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Top-down range map of shots">${g}</svg>${empty}`;

  const points = pool.map(landing);
  const nearest = e => {
    const b = el.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    let best = null, gap = 28 * 28;
    for (const p of points) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < gap) { gap = d; best = p; } }
    return best;
  };
  el.onmousemove = e => {
    const p = nearest(e);
    el.style.cursor = p ? 'pointer' : '';
    if (p) showTip(e.clientX, e.clientY, `${clubName(p.s.club)}<br>${num(p.s.carry)} carry, ${sideText(p.s.offline)} offline<br>${num(p.s.ballSpeed, 1)} mph ball`);
    else hideTip();
  };
  el.onmouseleave = hideTip;
  el.onclick = e => { const p = nearest(e); if (p) { S.cursor = p.s.id; S.clubMenu = null; hideTip(); render(); } };
}

function renderMapStats(pool) {
  const smashes = values(pool, x => x.smash), sides = pool.map(x => x.offline);
  const cell = (name, text) => `<div><i>${name}</i><b>${text}</b></div>`;
  $('mapStats').innerHTML = cell('Shots', pool.length) +
    cell('Avg Smash', smashes.length ? num(mean(smashes), 2) : '—') +
    cell('Smash +/-', smashes.length > 1 ? num(deviation(smashes), 2) : '—') +
    cell('Offline +/-', pool.length > 1 ? num(deviation(sides)) : '—');
}

// History

function average(list, key) { const v = values(list, x => x[key]); return v.length ? mean(v) : null; }
const flagged = (s, v, d) => known(v) ? (s.official ? '' : '~') + num(v, d) : '—';

function renderHistory() {
  const list = sessions().reverse();
  if (S.histSession != null && !list.some(x => x.start === S.histSession)) S.histSession = null;
  const chosen = S.histSession == null ? S.shots : list.find(x => x.start === S.histSession).shots;

  $('sessions').innerHTML = `<button class="session${S.histSession == null ? ' on' : ''}" data-session="">
      <b>All Shots</b><span>${S.shots.length} shots, ${list.length} sessions</span></button>` +
    list.map(x => `<button class="session${S.histSession === x.start ? ' on' : ''}" data-session="${x.start}">
      <b>${longDay.format(new Date(x.start * 1000))}</b><span>${clock.format(new Date(x.start * 1000))}, ${x.shots.length} shot${x.shots.length === 1 ? '' : 's'}</span></button>`).join('');

  const clubs = [...new Set(chosen.map(x => x.club || ''))].sort((a, b) => clubRank(a) - clubRank(b));
  if (S.histClub != null && !clubs.includes(S.histClub)) S.histClub = null;
  $('histClubs').innerHTML = `<button class="chip${S.histClub == null ? ' on' : ''}" data-hclub="*">All Clubs</button>` +
    clubs.map(c => `<button class="chip${S.histClub === c ? ' on' : ''}" data-hclub="${c}">${clubName(c)}</button>`).join('');

  const filtered = S.histClub == null ? chosen : chosen.filter(x => (x.club || '') === S.histClub);
  const groups = clubs.filter(c => S.histClub == null || c === S.histClub).map(c => ({ c, rows: filtered.filter(x => (x.club || '') === c) }));
  $('byClub').innerHTML = `<thead><tr><th>Club</th><th>Shots</th><th>Ball Speed</th><th>Club Speed</th><th>Smash</th><th>Launch</th><th>Back Spin</th><th>Carry</th><th>Total</th><th>Max Height</th></tr></thead><tbody>` +
    groups.map(({ c, rows }) => `<tr><td>${clubName(c)}</td><td>${rows.length}</td><td>${num(average(rows, 'ballSpeed'), 1)}</td><td>${num(average(rows, 'clubSpeed'), 1)}</td><td>${num(average(rows, 'smash'), 2)}</td><td>${num(average(rows, 'launch'), 1)}°</td><td>${num(average(rows, 'backSpin'))}</td><td>${num(average(rows, 'carry'))}</td><td>${num(average(rows, 'total'))}</td><td>${num(average(rows, 'apex'), 1)}</td></tr>`).join('') + '</tbody>';

  $('shotTable').innerHTML = `<thead><tr><th>When</th><th>Club</th><th>Shape</th><th>Ball Speed</th><th>Club Speed</th><th>Smash</th><th>Launch</th><th>Side Angle</th><th>Back Spin</th><th>Side Spin</th><th>Carry</th><th>Total</th><th>Offline</th><th>Club Path</th><th>Face to Path</th></tr></thead><tbody>` +
    [...filtered].reverse().slice(0, 1000).map(s => {
      const est = s.pathEstimated ? '~' : '';
      return `<tr data-id="${s.id}"><td>${when(s.time)}</td><td>${s.club ? clubShort(s.club) : '—'}</td><td>${(coach(s, []) || { title: '—' }).title}</td><td>${num(s.ballSpeed, 1)}</td><td>${num(s.clubSpeed, 1)}</td><td>${num(s.smash, 2)}</td><td>${num(s.launch, 1)}°</td><td>${sideText(s.hla, 1)}</td><td>${num(s.backSpin)}</td><td>${sideText(s.sideSpin)}</td><td>${flagged(s, s.carry, 0)}</td><td>${flagged(s, s.total, 0)}</td><td>${s.official || !known(s.offline) ? '' : '~'}${sideText(s.offline)}</td><td>${known(s.clubPath) ? est : ''}${sideText(s.clubPath, 1)}</td><td>${known(s.faceToPath) ? est : ''}${sideText(s.faceToPath, 1)}</td></tr>`;
    }).join('') + '</tbody>';
}

// Top bar

function ago(seconds) {
  if (seconds < 3) return 'just now';
  if (seconds < 90) return Math.round(seconds) + 's ago';
  if (seconds < 5400) return Math.round(seconds / 60) + 'm ago';
  return Math.round(seconds / 3600) + 'h ago';
}

function renderConnection() {
  const s = S.status;
  if (!s) return;
  let level = 'warn', title, detail;
  if (!s.logFound) { level = 'crit'; title = 'SkyTrak files not found'; detail = 'Open SkyTrak once on this Mac'; }
  else if (!s.skyTrakRunning) { title = 'Waiting for SkyTrak'; detail = 'Watching its files'; }
  else if (s.logAge > 30) { title = 'SkyTrak is quiet'; detail = 'No new data for ' + ago(s.logAge).replace(' ago', ''); }
  else if (!s.monitorConnected) { title = 'Launch monitor offline'; detail = 'Reading SkyTrak files, updated ' + ago(s.logAge); }
  else { level = 'good'; title = 'Connected'; detail = 'Reading SkyTrak files, updated ' + ago(s.logAge); }
  const icon = { good: '✓', warn: '!', crit: '✕' }[level];
  $('conn').innerHTML = `<div class="dot ${level}">${icon}</div><b>${title}</b><span>${detail}</span>`;
  $('device').innerHTML = known(s.battery) ? `DEVICE<b>${Math.round(s.battery)}%</b>` : '';
}

function renderUpdate() {
  const u = S.update;
  if (!u) return;
  const labels = {
    available: 'Update available', checking: 'Checking for updates', downloading: 'Downloading update',
    installing: 'Restarting', failed: 'Update failed, try again', offline: `v${u.current}, can't reach GitHub`,
  };
  const text = labels[u.phase] || `v${u.current}, up to date`;
  const b = $('update');
  b.textContent = text;
  b.disabled = ['checking', 'downloading', 'installing'].includes(u.phase);
  b.title = u.message || '';
  // Anything the person should act on or watch is shown without opening the menu.
  const now = $('updateNow');
  now.hidden = !['available', 'downloading', 'installing', 'failed'].includes(u.phase);
  now.textContent = text;
  now.disabled = b.disabled;
}

function render() {
  document.querySelectorAll('[data-view]').forEach(t => t.classList.toggle('on', t.dataset.view === S.view));
  $('fill').textContent = S.fill ? 'Exit Full Screen' : 'Full Screen';
  $('hand').textContent = S.lefty ? 'Golfer: Left-Handed' : 'Golfer: Right-Handed';
  $('live').hidden = S.view !== 'live';
  $('history').hidden = S.view !== 'history';
  if (S.view === 'live') renderLive(); else renderHistory();
}

function upsert(shot) {
  const i = S.shots.findIndex(s => s.id === shot.id);
  if (i >= 0) S.shots[i] = shot; else S.shots.push(shot);
  S.shots.sort((a, b) => a.time - b.time);
}

let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}

window.receive = m => {
  switch (m.type) {
    case 'shots': S.shots = m.data; render(); break;
    case 'ranges': S.ranges = m.data; render(); break;
    case 'newShot':
      upsert(m.data);
      S.cursor = null; S.clubMenu = null; S.fresh = S.view === 'live';
      render();
      break;
    case 'shotChanged': upsert(m.data); render(); break;
    case 'status': S.status = m.data; renderConnection(); break;
    case 'update': S.update = m.data; renderUpdate(); break;
    case 'prefs':
      S.nextClub = m.data.club; S.mapClearedAt = m.data.mapClearedAt; S.mapMode = m.data.mapMode;
      S.fill = m.data.fill; S.details = m.data.showDetails; S.lefty = m.data.lefty;
      render();
      break;
    case 'misread': toast("SkyTrak didn't get a reading on that one"); break;
  }
};

function runUpdateAction() {
  native({ action: S.update && S.update.phase === 'available' ? 'install' : 'check' });
}

document.addEventListener('click', e => {
  if (S.menuOpen && !e.target.closest('#menuBtn')) { S.menuOpen = false; $('menu').hidden = true; }
  if (S.clubMenu && !e.target.closest('#clubPop, #clubBtn, #edit')) { S.clubMenu = null; $('clubPop').hidden = true; }
  const b = e.target.closest('button, tr[data-id]');
  if (!b) return;
  const shot = S.shots[cursorIndex()];
  if (b.dataset.view) { S.view = b.dataset.view; render(); }
  else if (b.dataset.mode) { S.mapMode = b.dataset.mode; native({ action: 'mapMode', mode: S.mapMode }); render(); }
  else if (b.dataset.club) {
    const club = b.dataset.club;
    if (S.clubMenu === 'shot' && shot) {
      native({ action: 'setShotClub', id: shot.id, club });
      shot.club = club;
    } else {
      S.nextClub = S.nextClub === club ? null : club;
      native({ action: 'selectClub', club: S.nextClub });
    }
    S.clubMenu = null;
    render();
  }
  else if (b.dataset.session !== undefined) { S.histSession = b.dataset.session ? Number(b.dataset.session) : null; S.histClub = null; render(); }
  else if (b.dataset.hclub !== undefined) { S.histClub = b.dataset.hclub === '*' ? null : b.dataset.hclub; render(); }
  else if (b.dataset.id) { S.cursor = b.dataset.id; S.view = 'live'; S.clubMenu = null; render(); }
  else if (b.id === 'prev' || b.id === 'next') {
    const i = cursorIndex() + (b.id === 'prev' ? -1 : 1);
    if (S.shots[i]) { S.cursor = i === S.shots.length - 1 ? null : S.shots[i].id; S.clubMenu = null; render(); }
  }
  else if (b.id === 'latest') { S.cursor = null; S.clubMenu = null; render(); }
  else if (b.id === 'clubBtn') { S.clubMenu = S.clubMenu === 'next' ? null : 'next'; render(); }
  else if (b.id === 'edit') { S.clubMenu = S.clubMenu === 'shot' ? null : 'shot'; render(); }
  else if (b.id === 'detailsBtn') { S.details = !S.details; native({ action: 'details', show: S.details }); render(); }
  else if (b.id === 'clear') { S.mapClearedAt = Date.now() / 1000; native({ action: 'clearMap', time: S.mapClearedAt }); render(); }
  else if (b.id === 'menuBtn') { S.menuOpen = !S.menuOpen; $('menu').hidden = !S.menuOpen; }
  else if (b.id === 'update' || b.id === 'updateNow') runUpdateAction();
  else if (b.id === 'hand') { S.lefty = !S.lefty; native({ action: 'lefty', on: S.lefty }); render(); }
  else if (b.id === 'fill') native({ action: 'toggleFill' });
  else if (b.id === 'display') native({ action: 'nextDisplay' });
  else if (b.id === 'quit') native({ action: 'quit' });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.fill) native({ action: 'toggleFill' }); });
window.addEventListener('resize', render);
render();
native({ action: 'ready' });
</script>
</body>
</html>
