name: Release

# Every push to main publishes a new version. The app's Update button picks it up.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: gh release create "v$VERSION" dist/SkyTrakStats.zip --title "v$VERSION" --notes "$NOTES"
